<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
	<defs>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#a78bfa" />
			<stop offset="1" stop-color="#f472b6" />
		</linearGradient>
		<radialGradient id="glow" cx="0.82" cy="0.15" r="0.75">
			<stop offset="0" stop-color="#6d28d9" stop-opacity="0.55" />
			<stop offset="0.55" stop-color="#6d28d9" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="glow2" cx="0.9" cy="0.95" r="0.6">
			<stop offset="0" stop-color="#ec4899" stop-opacity="0.35" />
			<stop offset="1" stop-color="#ec4899" stop-opacity="0" />
		</radialGradient>
	</defs>

	<!-- Full square backdrop so QuickLook adds no letterboxing -->
	<rect width="1200" height="1200" fill="#07070c" />

	<!-- The 1200x630 OG card, centred vertically (y 285..915) -->
	<g transform="translate(0, 285)">
		<rect width="1200" height="630" fill="#07070c" />
		<rect width="1200" height="630" fill="url(#glow)" />
		<rect width="1200" height="630" fill="url(#glow2)" />
		<rect x="8" y="8" width="1184" height="614" rx="24" fill="none" stroke="#20202d" stroke-width="2" />

		<!-- Brand -->
		<g transform="translate(80, 74)">
			<rect width="56" height="56" rx="14" fill="url(#accent)" />
			<path d="M18 16 L18 40 M18 28 L34 16 M22 30 L36 42" stroke="#07070c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
			<text x="76" y="40" font-size="34" font-weight="700" fill="#f4f4f8" letter-spacing="0.5">Kora</text>
		</g>

		<!-- Headline -->
		<g fill="#f4f4f8" font-weight="700" letter-spacing="-1">
			<text x="80" y="278" font-size="76">Build a faster web,</text>
			<text x="80" y="366" font-size="76">without the <tspan fill="url(#accent)">fight.</tspan></text>
		</g>

		<!-- Subtitle -->
		<text x="80" y="440" font-size="30" fill="#8c8ca0" font-weight="400">A performance-first SvelteKit starter — i18n, type-safe data &amp; SEO.</text>

		<!-- Footer meta -->
		<g transform="translate(80, 540)">
			<rect width="12" height="12" rx="3" fill="url(#accent)" />
			<text x="26" y="11" font-size="24" fill="#d6d6e0" font-weight="500" letter-spacing="0.3">Localized routing · Open Graph · hreflang</text>
		</g>
	</g>
</svg>
